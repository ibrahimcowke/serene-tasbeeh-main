<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening Tasbeehly...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #050210;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(251, 191, 36, 0.3);
      padding: 30px;
      border-radius: 24px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid transparent;
      border-top-color: #fbbf24;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    a.btn {
      display: inline-block;
      margin-top: 15px;
      background: linear-gradient(135deg, #059669, #0d9488);
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>📿 Tasbeehly</h2>
    <p>Opening your shared Dhikr in the app...</p>
    <div class="spinner"></div>
    <p id="status-text" style="font-size: 12px; color: #94a3b8;">If the app does not open automatically, tap below to install or open.</p>
    <a id="action-btn" href="#" class="btn">Open App / Install on Google Play</a>
  </div>

  <script>
    (function() {
      const search = window.location.search;
      const customScheme = "tasbeehly://open" + search;
      const playStoreUrl = "https://play.google.com/store/apps/details?id=com.ibrahimcowke.tasbeehly";

      // Store deferred deep link payload locally in case user is installing
      try {
        localStorage.setItem('tasbeehly_deferred_link', window.location.href);
      } catch (e) {}

      const actionBtn = document.getElementById('action-btn');
      actionBtn.href = customScheme;

      // Attempt to launch custom scheme app link
      const start = Date.now();
      window.location.href = customScheme;

      // Deferred timeout: if app isn't installed, redirect to Play Store after 1.5s
      setTimeout(function() {
        if (Date.now() - start < 2000) {
          document.getElementById('status-text').innerText = "Redirecting to Google Play Store to install Tasbeehly...";
          window.location.href = playStoreUrl;
        }
      }, 1500);
    })();
  </script>
</body>
</html>
